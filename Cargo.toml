[package]
name = "workbench"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "workbench"
path = "src/main.rs"

[dependencies]
clap       = { version = "4", features = ["derive"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
anyhow     = "1"
libc       = "0.2"
time       = { version = "0.3", features = ["formatting"] }
