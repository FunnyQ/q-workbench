id = "q.workbench"
name = "Q Workbench"
version = "0.1.1"
min_herdr_version = "0.7.4"
description = "Q's Herdr workspace actions and launchers"
platforms = ["macos"]

[[actions]]
id = "new-agent"
title = "New agent"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "q.workbench", "--entrypoint", "agent", "--placement", "popup", "--width", "60%", "--height", "70%"]

[[actions]]
id = "new-worktree-agent"
title = "New worktree agent"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "q.workbench", "--entrypoint", "worktree-agent", "--placement", "popup", "--width", "60%", "--height", "70%"]

[[actions]]
id = "dashboard"
title = "Open dashboard launcher"
contexts = ["workspace"]
command = ["zsh", "scripts/dashboard-launcher.zsh"]

[[actions]]
id = "project"
title = "Open project picker"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "q.workbench", "--entrypoint", "project", "--placement", "popup", "--width", "70%", "--height", "70%"]

[[actions]]
id = "ssh"
title = "Open SSH picker"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "q.workbench", "--entrypoint", "ssh", "--placement", "popup", "--width", "70%", "--height", "70%"]

[[actions]]
id = "restart-agent"
title = "Restart agent"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "q.workbench", "--entrypoint", "restart-agent", "--placement", "popup", "--width", "72", "--height", "16"]

[[panes]]
id = "agent"
title = "󱚟  new agent"
placement = "popup"
command = ["zsh", "scripts/new-agent-popup.zsh"]

[[panes]]
id = "worktree-agent"
title = "󱚟  new worktree agent"
placement = "popup"
command = ["zsh", "scripts/new-agent-popup.zsh", "worktree"]

[[panes]]
id = "project"
title = "󰉋 project"
placement = "popup"
command = ["zsh", "scripts/project-picker-popup.zsh"]

[[panes]]
id = "ssh"
title = " ssh"
placement = "popup"
command = ["zsh", "scripts/ssh-picker-popup.zsh"]

[[panes]]
id = "restart-agent"
title = "󰜉  Restart Agent"
placement = "popup"
command = ["zsh", "scripts/restart-agent-popup.zsh"]
