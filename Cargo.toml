[package]
name = "workbench"
version = "0.10.0"
edition = "2021"

[[bin]]
name = "workbench"
path = "src/main.rs"

[dependencies]
clap       = { version = "4", features = ["derive"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
anyhow     = "1"
libc       = "0.2"
time       = { version = "0.3", features = ["formatting"] }

# macOS keeps every dev build's object files beside the binary for lldb, so full debug info
# grew `target/` to 28 GB. Line tables still give panic backtraces their file and line.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# `project source` runs once per keystroke in the picker, so process startup is the
# dominant cost. A single fat-LTO codegen unit with symbols stripped keeps the binary
# small enough that dyld has little to map before `main` runs.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
