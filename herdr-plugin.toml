id = "q.workbench"
name = "Q Workbench"
version = "0.8.0"
min_herdr_version = "0.7.4"
description = "Q's Herdr workspace actions and launchers"
platforms = ["macos"]

[[actions]]
id = "new-agent"
title = "New agent"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "q.workbench", "--entrypoint", "agent", "--placement", "popup", "--width", "60%", "--height", "70%"]

[[actions]]
id = "new-worktree-agent"
title = "New worktree agent"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "q.workbench", "--entrypoint", "worktree-agent", "--placement", "popup", "--width", "60%", "--height", "70%"]

[[actions]]
id = "new-tab"
title = "New tab"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "q.workbench", "--entrypoint", "new-tab", "--placement", "popup", "--width", "60%", "--height", "70%"]

[[actions]]
id = "new-assistant"
title = "New personal assistant"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "q.workbench", "--entrypoint", "assistant", "--placement", "popup", "--width", "60%", "--height", "70%"]

[[actions]]
id = "dashboard"
title = "Open dashboard launcher"
contexts = ["workspace"]
command = ["./bin/workbench", "dashboard"]

[[actions]]
id = "project"
title = "Open project picker"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "q.workbench", "--entrypoint", "project", "--placement", "popup", "--width", "70%", "--height", "70%"]

[[actions]]
id = "project-review"
title = "Review project registry"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "q.workbench", "--entrypoint", "project-review", "--placement", "popup", "--width", "70%", "--height", "80%"]

[[actions]]
id = "ssh"
title = "Open SSH picker"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "q.workbench", "--entrypoint", "ssh", "--placement", "popup", "--width", "70%", "--height", "70%"]

[[actions]]
id = "restart-agent"
title = "Restart agent"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "q.workbench", "--entrypoint", "restart-agent", "--placement", "popup", "--width", "72", "--height", "16"]

[[actions]]
id = "even-out-panes"
title = "Even out panes"
contexts = ["workspace"]
command = ["./bin/workbench", "pane", "even"]

[[panes]]
id = "agent"
title = "󱚟  new agent"
placement = "popup"
command = ["./bin/workbench", "agent", "popup"]

[[panes]]
id = "worktree-agent"
title = "󱚟  new worktree agent"
placement = "popup"
command = ["./bin/workbench", "agent", "popup", "--worktree"]

[[panes]]
id = "new-tab"
title = "󰓩  new tab"
placement = "popup"
command = ["./bin/workbench", "tab", "new"]

[[panes]]
id = "assistant"
title = "  personal assistant"
placement = "popup"
command = ["./bin/workbench", "agent", "popup", "--layout", "personal-assistant"]

[[panes]]
id = "project"
title = "󰉋 project"
placement = "popup"
command = ["./bin/workbench", "project", "pick"]

[[panes]]
id = "project-review"
title = "󰉋 review projects"
placement = "popup"
command = ["./bin/workbench", "project", "review"]

[[panes]]
id = "ssh"
title = " ssh"
placement = "popup"
command = ["./bin/workbench", "ssh", "pick"]

[[panes]]
id = "restart-agent"
title = "󰜉  Restart Agent"
placement = "popup"
command = ["./bin/workbench", "agent", "restart"]
