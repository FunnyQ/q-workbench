# Example user config for q.workbench.
# Copy this file to ${XDG_CONFIG_HOME:-$HOME/.config}/herdr/plugins/config/q.workbench/config.toml.
#
# Every setting below carries its built-in default. Edit the values you want to change.
# Delete a line to hand that setting back to the default and its environment variable;
# a value written here always wins over the environment.
#
# TOML assigns every key after a [[table]] header to that table. Keep all the scalars in
# the first section, and keep each entry's own scalars above its nested tables.

# -- Paths and pointers -------------------------------------------------------

# Names a Herdr workspace label directly, not a config entry; matched against Herdr's workspace list.
dashboard_workspace = "personal-assistant"

# Layout used by a launch that does not come from a listed workspace: the project
# picker, a restart, an agent started in the current tab. Names a [[tab_layouts]] entry.
default_tab_layout = "agentic-coding"

# Project registry JSON path.
project_registry_file = "$HOME/.local/state/herdr-projects/registry.json"

# Root directory scanned for projects.
projects_root = "$HOME/Projects"

# SSH target registry JSON path.
ssh_registry_file = "$HOME/.local/state/ssh-targets/registry.json"

# SSH config file read and updated by sync.
ssh_config_file = "$HOME/.config/ssh/config"

# Shell history used to seed SSH targets.
ssh_history_file = "$HOME/.zsh_history"


# -- Tab layouts --------------------------------------------------------------
#
# A layout is selected with `--layout <name>` — `workbench agent popup --layout
# personal-assistant`, or a Herdr action whose command carries the flag. Without the
# flag the launcher uses `default_tab_layout`. The `new-tab` action asks, listing every
# layout with `default_tab_layout` first. When only one layout is defined, it skips the
# menu.
#
# LEAVING A CHOICE OUT MEANS ASKING FOR IT. Write agent, option, or tab_label to pin
# that choice and skip its menu. Omit it and the launcher asks, exactly as it does
# today. The first layout below omits all three and reproduces today's popup.
#
# Layout keys:
#   name       Stable id. A workspace and default_tab_layout name it.
#   label      Layout menu text. Defaults to name.
#   icon       Drawn before the label, separated by two spaces: "${icon}  ${label}".
#   tab_label  Tab title, and with it the title of the agent pane. Omit to ask: the
#              usage menu runs, and a chosen worktree branch is appended to the answer.
#              A layout with no agent pane never asks; it uses label, else name.
#
# Panes are created top to bottom. The first is the tab's root: it fills the tab, so it
# takes no geometry. Each later pane splits an existing pane in half.
#
#   name        Unique within the layout. A later split_from names it.
#   label       Pane title. The root pane follows tab_label; an agent pane falls back to
#               the name of the harness it is running; any other pane falls back to
#               Herdr's own title.
#   icon        Drawn before the label, separated by two spaces: "${icon}  ${label}".
#               Any text - an emoji, a Nerd Font glyph, a letter. Nerd Font glyphs show
#               as a box in an editor without the font, so each one below carries its
#               codepoint name as a comment.
#   type        "agent", "command", or "shell".
#                 agent    Runs the harness. A layout may declare none, one, or several,
#                          at any position. Each unpinned agent pane runs its own harness
#                          and model menu, in the order the panes are written, and each
#                          restarts on its own.
#                 command  Runs command, then leaves the pane at its shell.
#                 shell    Interactive shell. Nothing is run.
#   agent       type = "agent". Names an [[agents]] entry. Omit to ask.
#   option      type = "agent". Names one of that agent's options. Omit to ask. Setting
#               it means setting agent too, because an option belongs to one agent.
#   command     type = "command". One shell line, typed into the pane's shell.
#   direction   "right" or "down". Herdr splits in these two only.
#   ratio       0 to 1. The share of the split this pane takes. Every entry describes
#               itself, so a small strip along the bottom is 0.1, not 0.9.
#   split_from  Pane to split. Defaults to the pane directly above, which is what a
#               straight chain of splits wants. Name it to branch back to an earlier one.
#   env         Environment variables for this pane alone.
#
# The root agent pane is the only one restart-in-place can reach through `agent launch`,
# because that path replaces the launcher process with exec. A layout whose root is not
# an agent pane therefore opens from the popup - the `new-tab` action or the project
# picker - not from `agent launch` in an existing pane.

# Today's popup, unchanged: harness, model, and usage are all asked.
[[tab_layouts]]
name = "agentic-coding"

  [[tab_layouts.panes]]
  name = "agent"
  type = "agent"
  env = { SOMETHING_DIFFERENT = "1" }

  [[tab_layouts.panes]]
  name = "files"
  label = "Files"
  icon = "󰥨"                  # nf-md-folder_eye
  type = "command"
  command = "yazi ."
  direction = "right"
  ratio = 0.62
  env = { SOMETHING_DIFFERENT = "1" }

  [[tab_layouts.panes]]
  name = "term"
  label = "term"
  icon = ""                  # nf-oct-terminal
  type = "shell"
  direction = "down"
  ratio = 0.1

# Everything pinned: opens straight to Opus, no menus at all.
[[tab_layouts]]
name = "personal-assistant"
label = "Personal Assistant"

  [[tab_layouts.panes]]
  name = "agent"
  label = "Main"
  type = "agent"
  agent = "claude code"
  option = "Opus"
  env = { SOMETHING_DIFFERENT = "1" }

  [[tab_layouts.panes]]
  name = "btop"
  label = "machine stats"
  icon = "📊"
  type = "command"
  command = "btop"
  direction = "right"
  ratio = 0.7
  env = { SOMETHING_DIFFERENT = "1" }

# Two harnesses side by side. `main` asks; `reviewer` is pinned, so the launch runs one
# harness menu and one model menu, then the usage menu once for the tab.
[[tab_layouts]]
name = "pair"
label = "Pair"

  [[tab_layouts.panes]]
  name = "main"
  type = "agent"

  [[tab_layouts.panes]]
  name = "reviewer"
  label = "Reviewer"
  type = "agent"
  agent = "codex"
  direction = "right"
  ratio = 0.5

# No agent pane at all: a plain tab of shells. No harness menu runs; the launcher asks for
# a tab name instead, and submitting nothing keeps the label below.
#
# "blank-tab" is a reserved name. The new-tab menu offers a blank tab whether or not this
# section exists, always as the last row, so declare it only to change what blank opens.
[[tab_layouts]]
name = "blank-tab"
label = "Blank Tab…"          # U+2026; the trailing ellipsis marks a row that prompts
icon = "󰓩"                    # nf-md-tab

  [[tab_layouts.panes]]
  name = "term"
  type = "shell"

# -- Agents -------------------------------------------------------------------
#
#   name        Stable id. A pane's agent field names it.
#   label       Harness menu text. Defaults to name.
#   icon        Drawn before the label, exactly as it is for a pane.
#   command     Executable and its fixed arguments.
#   extra_args  Appended to every launch of this agent.
#   options     Model menu, in menu order. An agent with no options skips that menu.
#                 name     Menu text, and the value a pane's option field names.
#                 args     Inserted after command, before extra_args.
#                 command  Replaces the agent's command for this option alone.
#
# Every argument is its own array entry. One whitespace-joined string would split
# "--cd /Users/q/My Projects" into two arguments.
#
# Bypass flags - --dangerously-skip-permissions, --dangerously-bypass-approvals-and-
# sandbox - disable permission, sandbox, and approval checks and grant the agent
# unrestricted access to this host. Nothing adds them for you. Put them in extra_args
# deliberately, per machine.

[[agents]]
name = "claude code"
icon = "󱗎"                    # nf-md-alpha_c_box
command = ["claude"]
extra_args = []

  [[agents.options]]
  name = "Opus"
  args = ["--model", "claude-opus-4-8"]

  [[agents.options]]
  name = "OpusPlan (Sonnet)"
  args = ["--model", "opusplan", "--effort", "medium"]

  # CCR dispatches to its own binary and takes no model flag.
  [[agents.options]]
  name = "CCR"
  command = ["ccr", "code"]

  [[agents.options]]
  name = "Fable 5"
  args = ["--model", "claude-fable-5"]

[[agents]]
name = "codex"
icon = ""                    # nf-seti-config
command = ["codex"]
extra_args = []

[[agents]]
name = "opencode"
icon = "󱚟"                    # nf-md-robot
command = ["opencode"]
extra_args = []
